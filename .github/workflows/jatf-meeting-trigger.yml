name: JATF Meeting Refresh Trigger

on:
  push:
    branches: [main]
    paths:
      - .jatf-refresh-request

permissions:
  actions: write
  contents: read

jobs:
  dispatch-market-refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Check out refresh request
        uses: actions/checkout@v4

      - name: Read request metadata
        id: request
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import re

          body = Path('.jatf-refresh-request').read_text(encoding='utf-8')
          match = re.search(r'(?im)^\s*market\s*:\s*(US|HK|ALL)\s*$', body)
          market = match.group(1).upper() if match else 'ALL'

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'market={market}\n')

          print(f'Refresh request accepted for {market}')
          print(body)
          PY

      - name: Dispatch HK market workflow
        if: steps.request.outputs.market == 'HK'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${REPOSITORY}/actions/workflows/jatf-hk-market-data.yml/dispatches" \
            -f ref="${GITHUB_REF_NAME}"

      - name: Dispatch US market workflow
        if: steps.request.outputs.market == 'US'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${REPOSITORY}/actions/workflows/jatf-market-data.yml/dispatches" \
            -f ref="${GITHUB_REF_NAME}"

      - name: Dispatch all market workflows
        if: steps.request.outputs.market == 'ALL'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${REPOSITORY}/actions/workflows/jatf-hk-market-data.yml/dispatches" \
            -f ref="${GITHUB_REF_NAME}"
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${REPOSITORY}/actions/workflows/jatf-market-data.yml/dispatches" \
            -f ref="${GITHUB_REF_NAME}"

      - name: Record dispatch
        env:
          MARKET: ${{ steps.request.outputs.market }}
        run: |
          echo "JATF live market data refresh dispatched for ${MARKET}."