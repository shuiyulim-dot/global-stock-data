name: JATF Market Data

on:
  workflow_dispatch:

jobs:
  update-hk-market-data:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch and upload Hong Kong quotes
        env:
          JATF_WEB_APP_URL: ${{ secrets.JATF_WEB_APP_URL }}
          JATF_API_TOKEN: ${{ secrets.JATF_API_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.request
          from datetime import datetime
          from zoneinfo import ZoneInfo

          WATCHLIST = [
              "00700",
              "00981",
              "02476",
              "02513",
              "06869",
              "07709",
              "06082",
              "01888",
              "06809",
          ]

          WEB_APP_URL = os.environ.get("JATF_WEB_APP_URL", "").strip()
          API_TOKEN = os.environ.get("JATF_API_TOKEN", "").strip()

          if not WEB_APP_URL:
              raise RuntimeError("Missing GitHub secret: JATF_WEB_APP_URL")

          if not API_TOKEN:
              raise RuntimeError("Missing GitHub secret: JATF_API_TOKEN")

          def safe_float(value):
              try:
                  text = str(value).strip().replace(",", "").replace("%", "")
                  return float(text) if text else None
              except (TypeError, ValueError):
                  return None

          def fetch_tencent_quote(code):
              url = f"https://qt.gtimg.cn/q=r_hk{code}"

              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "Mozilla/5.0",
                      "Referer": "https://stockapp.finance.qq.com/",
                  },
              )

              with urllib.request.urlopen(request, timeout=20) as response:
                  raw = response.read()

              text = raw.decode("gbk", errors="replace").strip()

              if '="' not in text:
                  raise ValueError(
                      f"Unexpected Tencent response for {code}: {text[:120]}"
                  )

              payload = text.split('="', 1)[1].rsplit('"', 1)[0]
              fields = payload.split("~")

              if len(fields) < 59:
                  raise ValueError(
                      f"Insufficient Tencent fields for {code}: {len(fields)}"
                  )

              quote_time = fields[30].strip()

              if len(quote_time) == 14 and quote_time.isdigit():
                  quote_time = (
                      f"{quote_time[0:4]}/{quote_time[4:6]}/{quote_time[6:8]} "
                      f"{quote_time[8:10]}:{quote_time[10:12]}:{quote_time[12:14]}"
                  )

              return {
                  "market": "HK",
                  "code": str(int(code)),
                  "name": fields[1].strip(),
                  "price": safe_float(fields[3]),
                  "open": safe_float(fields[5]),
                  "high": safe_float(fields[33]),
                  "low": safe_float(fields[34]),
                  "volume": safe_float(fields[6]),
                  "turnover": safe_float(fields[37]),
                  "change_percent": safe_float(fields[32]),
                  "quote_time": quote_time,
                  "source": "Tencent",
                  "status": "OK",
                  "notes": "",
              }

          quotes = []
          failures = []

          for code in WATCHLIST:
              try:
                  quote = fetch_tencent_quote(code)
                  quotes.append(quote)

                  print(
                      f"{quote['code']:>5} | "
                      f"{quote['name']:<20} | "
                      f"{quote['price']} | "
                      f"{quote['change_percent']}% | "
                      f"{quote['quote_time']}"
                  )

              except Exception as error:
                  failures.append({
                      "code": code,
                      "error": str(error),
                  })
                  print(
                      f"FAILED {code}: {error}",
                      file=sys.stderr,
                  )

          if not quotes:
              raise RuntimeError("No valid quotes were retrieved.")

          hk_now = datetime.now(ZoneInfo("Asia/Hong_Kong"))

          payload = {
              "token": API_TOKEN,
              "snapshot_date": hk_now.strftime("%Y-%m-%d"),
              "quotes": quotes,
              "metadata": {
                  "requested": len(WATCHLIST),
                  "successful": len(quotes),
                  "failed": len(failures),
                  "failures": failures,
                  "generated_at": hk_now.isoformat(),
              },
          }

          body = json.dumps(
              payload,
              ensure_ascii=False,
          ).encode("utf-8")

          request = urllib.request.Request(
              WEB_APP_URL,
              data=body,
              headers={
                  "Content-Type": "application/json; charset=utf-8",
                  "User-Agent": "JATF-GitHub-Actions/1.0",
              },
              method="POST",
          )

          with urllib.request.urlopen(request, timeout=30) as response:
              response_text = response.read().decode(
                  "utf-8",
                  errors="replace",
              )
              status_code = response.status

          print(f"Apps Script HTTP status: {status_code}")
          print(f"Apps Script response: {response_text}")

          try:
              result = json.loads(response_text)
          except json.JSONDecodeError as error:
              raise RuntimeError(
                  f"Apps Script returned non-JSON response: "
                  f"{response_text[:500]}"
              ) from error

          if result.get("status") != "success":
              raise RuntimeError(
                  f"Apps Script rejected upload: {result}"
              )

          print(
              f"Upload successful: "
              f"{result.get('rows_written', 0)} written, "
              f"{result.get('duplicates_skipped', 0)} duplicates skipped, "
              f"{result.get('expired_rows_deleted', 0)} expired rows deleted."
          )
          PY
